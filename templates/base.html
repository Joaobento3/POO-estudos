<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculdade de Tecnologia - {% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="{{ url_for('index') }}" class="logo">FaculTech</a>
            <div class="nav-links">
                {% if session.get('user_id') %}
                    <span>Olá, <strong>{{ session['user_nome'] }}</strong></span>
                    <a href="{{ url_for('logout') }}">Sair</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container content">
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
